<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ═══ Task I: Viewport Meta Tag for Responsive Design ═══
         The viewport meta tag ensures the page scales correctly on all devices.
         'width=device-width' sets the viewport width to the device's screen width.
         'initial-scale=1.0' sets the initial zoom level to 100%.
         This is essential for responsive web design. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Campus Companion — Smart attendance tracking for college students. Track, analyze, and optimize your attendance across all subjects." />
    <title>Campus Companion — Attendance Tracker</title>

    <!-- ═══ Bootstrap 5.3 CSS (CDN) ═══
         Used for responsive grid system, form components, modals, and utility classes.
         Demonstrates Bootstrap integration for FSD coursework requirement. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/3p0TzCECb1aCOt3y2B7b3o0+5aBdD55" crossorigin="anonymous" />

    <!-- ═══ Material Symbols Outlined (CDN) ═══
         Modern icon set matching the Stitch-generated design system. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ═══ Bootstrap 5.3 JS Bundle (CDN) ═══
         Includes Popper.js for dropdowns, modals, tooltips, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
