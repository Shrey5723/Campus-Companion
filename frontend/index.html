<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ═══ Task I: Viewport Meta Tag for Responsive Design ═══
         The viewport meta tag ensures the page scales correctly on all devices.
         'width=device-width' sets the viewport width to the device's screen width.
         'initial-scale=1.0' sets the initial zoom level to 100%.
         This is essential for responsive web design. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Campus Companion — Smart attendance tracking for college students. Track, analyze, and optimize your attendance across all subjects." />
    <title>Campus Companion — Attendance Tracker</title>
